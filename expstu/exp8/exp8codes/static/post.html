<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章阅读</title>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<style>
/* ── Variables ──────────────────────────────────────────────────────── */
:root {
  --bg: #faf6f0;
  --bg-warm: #f5efe4;
  --surface: #ffffff;
  --surface-hover: #fefcf9;
  --text: #2c2416;
  --text-secondary: #7d7365;
  --text-muted: #a89880;
  --accent: #b87333;
  --accent-light: #e8d5c4;
  --accent-glow: rgba(184, 115, 51, 0.12);
  --danger: #c94b4b;
  --border: #e8e0d5;
  --border-light: #f0ebe2;
  --shadow-sm: 0 1px 2px rgba(44, 36, 22, 0.04);
  --shadow: 0 1px 3px rgba(44, 36, 22, 0.07), 0 1px 2px rgba(44, 36, 22, 0.05);
  --shadow-md: 0 4px 16px rgba(44, 36, 22, 0.08);
  --radius: 6px;
  --radius-lg: 12px;
  --font-display: Georgia, 'Times New Roman', 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --transition: 180ms ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: 15px; line-height: 1.6;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(184, 115, 51, 0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(107, 143, 113, 0.03) 0%, transparent 60%);
}

a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
a:hover { color: #9a5e28; }

/* ── Header ─────────────────────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.header-inner {
  max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 56px;
}

.brand {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 700;
  color: var(--text); letter-spacing: -0.3px;
  display: inline-flex; align-items: center; gap: 8px;
}
.brand:hover { color: var(--accent); }

.btn-back {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 16px; border-radius: var(--radius);
  font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border);
  cursor: pointer; transition: all var(--transition);
  font-family: var(--font-body);
}
.btn-back:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }

/* ── Article ─────────────────────────────────────────────────────────── */
.container {
  max-width: 960px; margin: 0 auto; padding: 0 28px 60px;
}

.article-header {
  padding: 48px 0 28px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 36px;
}

.article-title {
  font-family: var(--font-display);
  font-size: clamp(24px, 4vw, 36px); font-weight: 700;
  color: var(--text); line-height: 1.35; margin-bottom: 16px;
}

.article-meta {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  font-size: 14px; color: var(--text-muted);
}

.article-author {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-secondary); font-weight: 500;
}

.article-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}

.article-favors { color: var(--danger); font-weight: 500; }

/* ── Article Content ─────────────────────────────────────────────────── */
.article-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 40px 48px;
  box-shadow: var(--shadow);
}

@media (max-width: 768px) {
  .container { padding: 0 16px 40px; }
  .article-card { padding: 24px 20px; }
  .article-header { padding: 32px 0 20px; }
}

.article-card h1, .article-card h2, .article-card h3 {
  font-family: var(--font-display);
  margin: 28px 0 12px; color: var(--text);
}
.article-card h1 { font-size: 24px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
.article-card h2 { font-size: 20px; }
.article-card h3 { font-size: 17px; }
.article-card p { margin: 0 0 14px; }
.article-card ul, .article-card ol { padding-left: 24px; margin: 0 0 14px; }
.article-card li { margin-bottom: 6px; }
.article-card code {
  background: var(--bg-warm); padding: 2px 6px; border-radius: 3px;
  font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace;
}
.article-card pre {
  background: #2c2416; color: #faf6f0; padding: 20px 24px;
  border-radius: var(--radius); overflow-x: auto; margin: 0 0 18px;
}
.article-card pre code { background: transparent; padding: 0; color: inherit; }
.article-card blockquote {
  border-left: 3px solid var(--accent); padding: 10px 20px;
  margin: 0 0 14px; background: var(--accent-glow);
  border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--text-secondary);
}
.article-card table {
  width: 100%; border-collapse: collapse; margin: 0 0 14px;
}
.article-card th, .article-card td {
  border: 1px solid var(--border); padding: 10px 14px; text-align: left;
}
.article-card th { background: var(--bg-warm); font-weight: 600; }
.article-card a { color: var(--accent); text-decoration: underline; }
.article-card img { max-width: 100%; border-radius: var(--radius); }
.article-card hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.article-card strong { color: var(--text); }

/* ── PDF Embed ───────────────────────────────────────────────────────── */
.pdf-wrap {
  width: 100%; aspect-ratio: 16 / 10; background: #f9f8f6;
  border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.pdf-wrap iframe { width: 100%; height: 100%; border: 0; }

.btn-delete-post {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 14px; border-radius: var(--radius);
  font-size: 13px; color: var(--danger); background: transparent;
  border: 1px solid var(--danger); cursor: pointer;
  font-family: var(--font-body); transition: all var(--transition);
}
.btn-delete-post:hover { background: var(--danger); color: #fff; }

/* ── Loading / Error ─────────────────────────────────────────────────── */
.loading, .error-state {
  text-align: center; padding: 80px 20px;
}
.loading p { font-size: 14px; color: var(--text-muted); margin-top: 16px; }
.spinner {
  width: 32px; height: 32px; margin: 0 auto;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-state h2 {
  font-family: var(--font-display);
  font-size: 20px; color: var(--text-secondary); margin-bottom: 8px;
}
.error-state p { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
  <a href="/" class="brand">&#x1F4DA; PDF 社区</a>
  <button class="btn-back" onclick="window.location='/'">&larr; 返回社区</button>
</div>
</header>

<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>加载文章中...</p>
  </div>
  <div class="error-state" id="error" style="display:none">
    <h2>文章不存在</h2>
    <p>这篇帖子可能已被删除，或者链接地址有误。</p>
    <a href="/" class="btn-back" style="display:inline-flex;text-decoration:none">返回首页</a>
  </div>
  <div id="content" style="display:none"></div>
</div>

<script src="/static/jquery-1.12.4.js"></script>
<script src="/static/jquery.cookie.js"></script>
<script src="/static/marked.min.js"></script>
<script>
// ── Ensure userId cookie is set (for direct links from sidebar/recs) ─
(function() {
    var token = $.cookie('bearer_token');
    var uid = $.cookie('loginUserId');
    if (token && !uid) {
        $.ajax({
            type: 'POST', url: '/user/userinfo',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function(res) {
                if (res.result === 'success') {
                    $.cookie('loginUserId', res.userid, { path: '/' });
                }
                loadPost();
            },
            error: function() { loadPost(); }
        });
    } else {
        loadPost();
    }
})();
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatDate(sec) {
    return new Date(sec * 1000).toLocaleString('zh-CN');
}

function deleteCurrentPost(postid) {
    var token = $.cookie('bearer_token');
    if (!token) { alert('请先登录'); return; }
    if (!confirm('确定要删除这篇帖子吗？删除后不可恢复。')) return;
    $.ajax({
        type: 'POST', url: '/user/setpost',
        headers: { 'Authorization': 'Bearer ' + token },
        contentType: 'application/json',
        data: JSON.stringify({ postid: postid, isdel: true }),
        success: function(res) {
            if (res.result === 'success') {
                alert('删除成功');
                window.location.href = '/';
            } else {
                alert('删除失败: ' + res.result);
            }
        },
        error: function() { alert('请求失败，请重试'); }
    });
}

// ── Load post ──────────────────────────────────────────────────────────
function loadPost() {
    var postId = new URLSearchParams(window.location.search).get('id');
    if (!postId) {
        $('#loading').hide();
        $('#error').show().find('h2').text('缺少文章ID').end()
            .find('p').text('请在URL中提供 ?id= 参数');
        return;
    }
    $.ajax({
        url: '/post/' + postId,
        type: 'GET',
        success: function(res) { renderPost(res); },
        error: function() {
            $('#loading').hide();
            $('#error').show();
        }
    });
}

function renderPost(res) {
    if (res.result !== 'success' || !res.post) {
        $('#loading').hide();
        $('#error').show();
        return;
    }

    var p = res.post;
    var isMd = /\.md$/i.test(p.rdir);
    var initial = (p.username || '?')[0].toUpperCase();
    var myUserId = parseInt($.cookie('loginUserId')) || 0;
    var isOwner = myUserId === p.userid;

    // Build header
    var deleteHtml = isOwner
        ? '<div style="margin-top:14px"><button class="btn-delete-post" onclick="deleteCurrentPost(' + p.id + ')">&#x1F5D1; 删除此帖</button></div>'
        : '';
    var header =
        '<div class="article-header">' +
          '<h1 class="article-title">' + escapeHtml(p.filename) + '</h1>' +
          '<div class="article-meta">' +
            '<span class="article-author">' +
              '<span class="article-avatar">' + initial + '</span>' +
              escapeHtml(p.username) +
            '</span>' +
            '<span>' + formatDate(p.datesec) + '</span>' +
            '<span class="article-favors">&#x2764; ' + (p.favors || 0) + ' 人收藏</span>' +
          '</div>' +
          deleteHtml +
        '</div>';

    if (isMd) {
        // Markdown: fetch raw content and render
        $('#content').html(header + '<div class="article-card"><p style="color:var(--text-muted);text-align:center;padding:40px">加载 Markdown 内容...</p></div>');
        $('#loading').hide();
        $('#content').show();
        document.title = p.filename + ' - PDF 社区';

        $.ajax({
            url: '/post/' + p.rdir,
            type: 'GET',
            dataType: 'text',
            success: function(raw) {
                var html = marked.parse(raw);
                $('#content').html(
                    header +
                    '<div class="article-card"><div class="article-md">' + html + '</div></div>'
                );
            },
            error: function() {
                $('#content').html(
                    header +
                    '<div class="article-card"><p style="color:var(--danger);text-align:center;padding:40px">内容加载失败</p></div>'
                );
            }
        });
    } else {
        // PDF: embed viewer
        var pdfUrl = '/post/' + p.rdir;
        var body =
            header +
            '<div class="pdf-wrap">' +
              '<iframe src="' + pdfUrl + '#toolbar=0"></iframe>' +
            '</div>' +
            '<div style="text-align:center;margin-top:16px">' +
              '<a href="' + pdfUrl + '" target="_blank" class="btn-back" style="display:inline-flex;text-decoration:none">在新标签页打开 &#x2197;</a>' +
            '</div>';
        $('#content').html(body);
        $('#loading').hide();
        $('#content').show();
        document.title = p.filename + ' - PDF 社区';
    }
}
</script>
</body>
</html>
